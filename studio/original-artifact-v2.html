<meta charset="utf-8" />
<title>Continuum Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* === bpmn-js / diagram-js engine styles (bpmn.io license, https://bpmn.io/license) === */

/* diagram-js.css */
/**
 * color definitions
 */
.djs-parent {
  --color-grey-225-10-15: hsl(225, 10%, 15%);
  --color-grey-225-10-35: hsl(225, 10%, 35%);
  --color-grey-225-10-55: hsl(225, 10%, 55%);
  --color-grey-225-10-75: hsl(225, 10%, 75%);
  --color-grey-225-10-80: hsl(225, 10%, 80%);
  --color-grey-225-10-85: hsl(225, 10%, 85%);
  --color-grey-225-10-90: hsl(225, 10%, 90%);
  --color-grey-225-10-95: hsl(225, 10%, 95%);
  --color-grey-225-10-97: hsl(225, 10%, 97%);

  --color-blue-205-100-45: hsl(205, 100%, 45%);
  --color-blue-205-100-45-opacity-30: hsla(205, 100%, 45%, 30%);
  --color-blue-205-100-50: hsl(205, 100%, 50%);
  --color-blue-205-100-50-opacity-15: hsla(205, 100%, 50%, 15%);
  --color-blue-205-100-70: hsl(205, 100%, 75%);
  --color-blue-205-100-95: hsl(205, 100%, 95%);

  --color-green-150-86-44: hsl(150, 86%, 44%);

  --color-red-360-100-40: hsl(360, 100%, 40%);
  --color-red-360-100-45: hsl(360, 100%, 45%);
  --color-red-360-100-92: hsl(360, 100%, 92%);
  --color-red-360-100-97: hsl(360, 100%, 97%);

  --color-white: hsl(0, 0%, 100%);
  --color-black: hsl(0, 0%, 0%);
  --color-black-opacity-10: hsla(0, 0%, 0%, 10%);
  --color-black-opacity-30: hsla(0, 0%, 0%, 30%);

  --canvas-fill-color: var(--color-white);

  --bendpoint-fill-color: var(--color-blue-205-100-45);
  --bendpoint-stroke-color: var(--canvas-fill-color);

  --context-pad-entry-background-color: var(--color-white);
  --context-pad-entry-hover-background-color: var(--color-grey-225-10-95);

  --element-dragger-color: var(--color-blue-205-100-50);
  --element-hover-outline-fill-color: var(--color-blue-205-100-45);
  --element-selected-outline-stroke-color: var(--color-blue-205-100-50);
  --element-selected-outline-secondary-stroke-color: var(--color-blue-205-100-70);

  --lasso-fill-color: var(--color-blue-205-100-50-opacity-15);
  --lasso-stroke-color: var(--element-selected-outline-stroke-color);

  --palette-entry-color: var(--color-grey-225-10-15);
  --palette-entry-hover-color: var(--color-blue-205-100-45);
  --palette-entry-selected-color: var(--color-blue-205-100-50);
  --palette-separator-color: var(--color-grey-225-10-75);
  --palette-toggle-hover-background-color: var(--color-grey-225-10-55);
  --palette-background-color: var(--color-grey-225-10-97);
  --palette-border-color: var(--color-grey-225-10-75);

  --popup-font-family: "IBM Plex Sans", sans-serif;
  --popup-font-size: 14px;
  --popup-secondary-font-size: .9em;
  --popup-header-entry-selected-color: var(--color-blue-205-100-50);
  --popup-header-font-weight: bolder;
  --popup-header-group-divider-color: var(--color-grey-225-10-75);
  --popup-background-color: var(--color-white);
  --popup-border-color: transparent;
  --popup-shadow-color: var(--color-black-opacity-30);
  --popup-disabled-color: var(--color-grey-225-10-35);
  --popup-description-color: var(--color-grey-225-10-35);
  --popup-no-results-color: var(--color-grey-225-10-55);
  --popup-entry-title-color: var(--color-grey-225-10-55);
  --popup-entry-hover-color:  var(--color-grey-225-10-95);
  --popup-search-border-color: var(--color-grey-225-10-75);
  --popup-search-focus-border-color: var(--color-blue-205-100-50);
  --popup-search-focus-background-color: var(--color-blue-205-100-95);
  --popup-tab-color: var(--color-grey-225-10-55);
  --popup-tab-hover-color: var(--color-grey-225-10-15);
  --popup-tab-active-color: var(--color-grey-225-10-15);
  --popup-tab-active-border-color: var(--color-blue-205-100-50);
  --popup-tab-strip-border-color: var(--color-grey-225-10-90);
  --popup-tab-focus-border-color: var(--color-blue-205-100-50);

  --resizer-fill-color: var(--color-blue-205-100-45);
  --resizer-stroke-color: var(--canvas-fill-color);

  --search-font-family: "IBM Plex Sans", sans-serif;
  --search-font-size: 14px;
  --search-container-background-color: var(--color-white);
  --search-shadow-color: var(--color-black-opacity-30);
  --search-input-border-color: var(--color-grey-225-10-75);
  --search-input-focus-border-color: var(--color-blue-205-100-50);
  --search-input-focus-background-color: var(--color-blue-205-100-95);
  --search-result-hover-background-color: var(--color-grey-225-10-95);
  --search-result-secondary-color: var(--color-grey-225-10-55);
  --search-preselected-background-color: var(--color-blue-205-100-50-opacity-15);

  --shape-attach-allowed-stroke-color: var(--color-blue-205-100-50);
  --shape-connect-allowed-fill-color: var(--color-grey-225-10-97);
  --shape-drop-allowed-fill-color: var(--color-grey-225-10-97);
  --shape-drop-not-allowed-fill-color: var(--color-red-360-100-97);
  --shape-resize-preview-stroke-color: var(--color-blue-205-100-50);

  --snap-line-stroke-color: var(--color-blue-205-100-45-opacity-30);

  --space-tool-crosshair-stroke-color: var(--color-black);

  --tooltip-error-background-color: var(--color-red-360-100-97);
  --tooltip-error-border-color: var(--color-red-360-100-45);
  --tooltip-error-color: var(--color-red-360-100-45);
}

/**
 * SVG styles
 */

.djs-container svg.drop-not-ok {
  background: var(--shape-drop-not-allowed-fill-color) !important;
}

.djs-container svg.new-parent {
  background: var(--shape-drop-allowed-fill-color) !important;
}

.djs-container svg:focus {
  outline-offset: -1px;
}

/**
 * outline styles
 */

.djs-outline,
.djs-selection-outline {
  fill: none;
  shape-rendering: geometricPrecision;
  stroke-width: 2px;
}

.djs-outline {
  visibility: hidden;
}

.djs-selection-outline {
  stroke: var(--element-selected-outline-stroke-color);
}

.djs-element.selected .djs-outline {
  visibility: visible;

  stroke: var(--element-selected-outline-stroke-color);
}

.djs-connection.selected .djs-outline {
  display: none;
}

.djs-multi-select .djs-element.selected .djs-outline,
.djs-dragging-active-lasso .djs-element.selected .djs-outline {
  stroke: var(--element-selected-outline-secondary-stroke-color);
  display: block;
}

.djs-outline-hidden .djs-outline {
  display: none !important;
}

.djs-shape.connect-ok .djs-visual > :nth-child(1) {
  fill: var(--shape-connect-allowed-fill-color) !important;
}

.djs-shape.connect-not-ok .djs-visual > :nth-child(1),
.djs-shape.drop-not-ok .djs-visual > :nth-child(1) {
  fill: var(--shape-drop-not-allowed-fill-color) !important;
}

.djs-shape.new-parent .djs-visual > :nth-child(1) {
  fill: var(--shape-drop-allowed-fill-color) !important;
}


/* Override move cursor during drop and connect */
.drop-not-ok,
.connect-not-ok,
.drop-not-ok *,
.connect-not-ok * {
  cursor: not-allowed !important;
}

.drop-ok,
.connect-ok,
.drop-ok *,
.connect-ok * {
  cursor: default !important;
}

.djs-element.attach-ok .djs-visual > :nth-child(1) {
  stroke-width: 5px !important;
  stroke: var(--shape-attach-allowed-stroke-color) !important;
}

.djs-frame.connect-not-ok .djs-visual > :nth-child(1),
.djs-frame.drop-not-ok .djs-visual > :nth-child(1) {
  stroke-width: 3px !important;
  stroke: var(--shape-drop-not-allowed-fill-color) !important;
  fill: none !important;
}

/**
* Selection box style
*
*/
.djs-lasso-overlay {
  fill: var(--lasso-fill-color);
  stroke: var(--lasso-stroke-color);
  stroke-width: 2px;
  shape-rendering: geometricPrecision;
  pointer-events: none;
}

/**
 * Resize styles
 */
.djs-resize-overlay {
  fill: none;

  stroke-dasharray: 5 1 3 1;
  stroke: var(--shape-resize-preview-stroke-color);

  pointer-events: none;
}

.djs-resizer-hit {
  fill: none;
  pointer-events: all;
}

.djs-resizer-visual {
  fill: var(--resizer-fill-color);
  stroke-width: 1px;
  stroke: var(--resizer-stroke-color);
  shape-rendering: geometricPrecision;
}

.djs-resizer:hover .djs-resizer-visual {
  stroke: var(--resizer-stroke-color);
  stroke-opacity: 1;
}

.djs-cursor-resize-ns,
.djs-resizer-n,
.djs-resizer-s {
  cursor: ns-resize;
}

.djs-cursor-resize-ew,
.djs-resizer-e,
.djs-resizer-w {
  cursor: ew-resize;
}

.djs-cursor-resize-nwse,
.djs-resizer-nw,
.djs-resizer-se {
  cursor: nwse-resize;
}

.djs-cursor-resize-nesw,
.djs-resizer-ne,
.djs-resizer-sw {
  cursor: nesw-resize;
}

.djs-shape.djs-resizing > .djs-outline {
  visibility: hidden !important;
}

.djs-shape.djs-resizing > .djs-resizer {
  visibility: hidden;
}

.djs-dragger > .djs-resizer {
  visibility: hidden;
}

/**
 * drag styles
 */
.djs-dragger * {
  fill: none !important;
  stroke: var(--element-dragger-color) !important;
}

.djs-dragger tspan,
.djs-dragger text {
  fill: var(--element-dragger-color) !important;
  stroke: none !important;
}

.djs-dragger marker circle,
.djs-dragger marker path,
.djs-dragger marker polygon,
.djs-dragger marker polyline,
.djs-dragger marker rect {
  fill: var(--element-dragger-color) !important;
  stroke: none !important;
}

.djs-dragger marker text,
.djs-dragger marker tspan {
  fill: none !important;
  stroke: var(--element-dragger-color) !important;
}

.djs-dragging,
.djs-dragging > * {
  opacity: 0.3 !important;
  pointer-events: none !important;
}

/**
 * no pointer events for visual
 */
.djs-visual,
.djs-outline {
  pointer-events: none;
}

.djs-element.attach-ok .djs-hit {
  stroke-width: 60px !important;
}

/**
 * all pointer events for hit shape
 */
.djs-element > .djs-hit-all,
.djs-element > .djs-hit-no-move {
  pointer-events: all;
}

.djs-element > .djs-hit-stroke,
.djs-element > .djs-hit-click-stroke {
  pointer-events: stroke;
}

/**
 * shape / connection basic styles
 */
.djs-connection .djs-visual {
  stroke-width: 2px;
  fill: none;
}

.djs-cursor-grab {
  cursor: -webkit-grab;
  cursor: -moz-grab;
  cursor: grab;
}

.djs-cursor-grabbing {
  cursor: -webkit-grabbing;
  cursor: -moz-grabbing;
  cursor: grabbing;
}

.djs-cursor-crosshair {
  cursor: crosshair;
}

.djs-cursor-move {
  cursor: move;
}

.djs-cursor-resize-ns {
  cursor: ns-resize;
}

.djs-cursor-resize-ew {
  cursor: ew-resize;
}


/**
 * snapping
 */
.djs-snap-line {
  stroke: var(--snap-line-stroke-color);
  stroke-linecap: round;
  stroke-width: 2px;
  pointer-events: none;
}

/**
 * snapping
 */
.djs-crosshair {
  stroke: var(--space-tool-crosshair-stroke-color);
  stroke-linecap: round;
  stroke-width: 1px;
  pointer-events: none;
  shape-rendering: geometricPrecision;
  stroke-dasharray: 5, 5;
}

/**
 * palette
 */

.djs-palette {
  position: absolute;
  left: 20px;
  top: 20px;

  box-sizing: border-box;
  width: 48px;
}

.djs-palette .separator {
  margin: 5px;
  padding-top: 5px;

  border: none;
  border-bottom: solid 1px var(--palette-separator-color);

  clear: both;
}

.djs-palette .entry:before {
  vertical-align: initial;
}

.djs-palette .djs-palette-toggle {
  cursor: pointer;
}

.djs-palette .entry,
.djs-palette .djs-palette-toggle {
  color: var(--palette-entry-color);
  font-size: 30px;

  text-align: center;
}

.djs-palette .entry {
  float: left;
}

.djs-palette .entry img {
  max-width: 100%;
}

.djs-palette .djs-palette-entries:after {
  content: '';
  display: table;
  clear: both;
}

.djs-palette .djs-palette-toggle:hover {
  background: var(--palette-toggle-hover-background-color);
}

.djs-palette .entry:hover {
  color: var(--palette-entry-hover-color);
}

.djs-palette .highlighted-entry {
  color: var(--palette-entry-selected-color) !important;
}

.djs-palette .entry,
.djs-palette .djs-palette-toggle {
  width: 46px;
  height: 46px;
  line-height: 46px;
  cursor: default;
}

/**
 * Palette open / two-column layout is controlled via
 * classes on the palette. Events to hook into palette
 * changed life-cycle are available in addition.
 */
.djs-palette.two-column.open {
  width: 94px;
}

.djs-palette:not(.open) .djs-palette-entries {
  display: none;
}

.djs-palette:not(.open) {
  overflow: hidden;
}

.djs-palette.open .djs-palette-toggle {
  display: none;
}

/**
 * context-pad
 */
.djs-context-pad {
  position: absolute;
  display: none;
  pointer-events: none;
  line-height: 1;
  width: 72px;
  z-index: 100;
}

.djs-context-pad .entry {
  width: 22px;
  height: 22px;
  text-align: center;
  display: inline-block;
  font-size: 22px;
  margin: 0 2px 2px 0;

  border-radius: 3px;

  cursor: default;

  background-color: var(--context-pad-entry-background-color);
  box-shadow: 0 0 2px 1px var(--context-pad-entry-background-color);
  pointer-events: all;
  vertical-align: middle;
}

.djs-context-pad .entry:hover {
  background: var(--context-pad-entry-hover-background-color);
}

.djs-context-pad.open {
  display: block;
}

/**
 * popup styles
 */
.djs-popup {
  line-height: 1;
  box-sizing: border-box;
  background: var(--popup-background-color);
  overflow: hidden;
  position: fixed;
  z-index: 200;
  box-shadow: 0px 2px 6px var(--popup-shadow-color);
  border: solid 1px var(--popup-border-color);
  min-width: 120px;
  max-width: 300px;
  outline: none;
  font-size: var(--popup-font-size);
  font-family: var(--popup-font-family);
}

.djs-popup-search input {
  width: 100%;
  box-sizing: border-box;
  font-size: var(--popup-font-size);
  padding: 3px 6px 3px 28px;
  border-radius: 2px;
  border: solid 1px var(--popup-search-border-color);
  line-height: 21px;
}

.djs-popup-search input:focus {
  background-color: var(--popup-search-focus-background-color);
  border: solid 1px var(--popup-search-focus-border-color);
  outline: none;
}

.djs-popup-header {
  display: flex;
  align-items: stretch;
  line-height: 20px;
  margin: 10px 12px 10px 12px;
}

.djs-popup-header .entry {
  border-radius: 2px;
}

.djs-popup button.entry {
  padding: 0;
  background: transparent;
  border: 0;
}

.djs-popup-header .entry.active {
  color: var(--popup-header-entry-selected-color);
}

.djs-popup-header .entry.disabled {
  color: inherit;
}

.djs-popup-header-group {
  display: flex;
  flex-direction: row;
  align-items: center;
  list-style: none;
  margin: 0;
  padding: 0;
}

.djs-popup-header-group .entry {
  display: flex;
  flex-direction: row;
  align-items: center;
}

.djs-popup-header-group + .djs-popup-header-group:before {
  content: '';
  width: 1px;
  height: 20px;
  background: var(--popup-header-group-divider-color);
  margin: 0 5px;
}

.djs-popup-search {
  position: relative;
  width: auto;
  margin: 10px 12px;
}

.djs-popup-tabs-container {
  position: relative;
  border-bottom: solid 1px var(--popup-tab-strip-border-color);
}

/**
 * The scroll control doubles as the edge fade: tabs scrolled past it fade out
 * rather than being cut off behind an opaque block.
 */
.djs-popup-tabs-scroll {
  appearance: none;
  position: absolute;
  top: 0;
  bottom: 1px;
  width: 28px;
  display: flex;
  align-items: center;
  padding: 0;
  border: none;
  border-radius: 0;
  color: var(--popup-tab-color);
  cursor: pointer;
}

.djs-popup-tabs-scroll:hover {
  color: var(--popup-tab-hover-color);
}

.djs-popup-tabs-scroll-start {
  left: 0;
  justify-content: flex-start;
  background: linear-gradient(to left, transparent, var(--popup-background-color) 60%);
}

.djs-popup-tabs-scroll-end {
  right: 0;
  justify-content: flex-end;
  background: linear-gradient(to right, transparent, var(--popup-background-color) 60%);
}

.djs-popup-tabs-scroll-start svg {
  transform: rotate(180deg);
}

.djs-popup-tabs {
  display: flex;
  flex-wrap: nowrap;
  gap: 2px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0 12px;

  /* keep scrolled-to tabs clear of the scroll controls */
  scroll-padding: 0 28px;
  scrollbar-width: none;
}

.djs-popup-tabs::-webkit-scrollbar {
  display: none;
}

.djs-popup-tab {
  appearance: none;
  background: transparent;
  border: none;
  border-bottom: solid 2px transparent;
  border-radius: 0;
  flex: 0 0 auto;
  padding: 6px 10px;
  font: inherit;
  font-size: var(--popup-font-size);
  color: var(--popup-tab-color);
  cursor: pointer;
  white-space: nowrap;
}

.djs-popup-tab:hover {
  color: var(--popup-tab-hover-color);
}

.djs-popup-tab:focus-visible {
  outline: solid 1px var(--popup-tab-focus-border-color);
  outline-offset: -2px;
}

.djs-popup-tab[aria-selected="true"] {
  color: var(--popup-tab-active-color);
  border-bottom-color: var(--popup-tab-active-border-color);
  font-weight: var(--popup-header-font-weight);
}

.djs-popup-title {
  font-size: var(--popup-font-size);
  font-weight: var(--popup-header-font-weight);
  flex: 1;
  margin: 0;
}

.djs-popup-breadcrumbs {
  display: flex;
  line-height: 20px;
  margin: 10px 12px;
}

.djs-popup-breadcrumbs-item {
  display: inline-flex;
  min-width: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  border: 0;
  outline: none;
  appearance: none;
  color: var(--popup-description-color);
  font: inherit;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.djs-popup-breadcrumbs-item--separator::before {
  display: inline-block;
  content: '/';
  color: var(--popup-description-color);
  margin: 0 4px;
}

.djs-popup-breadcrumbs-item:hover {
  color: inherit;
  text-decoration: underline;
}

.djs-popup-breadcrumbs-item:focus-visible {
  outline: 1px solid var(--popup-search-focus-border-color);
  outline-offset: 2px;
}

.djs-popup-breadcrumbs-item--back {
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 2px 3px;
  margin-right: 6px;
  border: 1px solid var(--popup-search-border-color);
  border-radius: 4px;
}

.djs-popup-breadcrumbs-item--back:hover {
  background: #f2f3f5;
}

.djs-popup-breadcrumbs-item--current {
  font-weight: var(--popup-header-font-weight);
  color: inherit;
  cursor: default;
}

.djs-popup-breadcrumbs-item--current:hover {
  text-decoration: none;
}

.djs-popup-entry-actions {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  gap: 6px;
  margin-left: 6px;
}

.djs-popup-entry-chevron {
  display: flex;
  align-items: center;
  color: var(--popup-description-color);
}

.djs-popup-search-icon {
  position: absolute;
  left: 8px;
  top: 7px;
}

.djs-popup-search-count {
  margin: 0 12px;
  font-size: var(--popup-secondary-font-size);
  color: var(--popup-description-color);
}

.djs-popup-results {
  margin: 7px 3px 7px 12px;
  list-style: none;
  max-height: 280px;
  overflow: auto;
  padding-right: 9px;
}

/**
 * The results list is focusable (as a listbox holding
 * `aria-activedescendant`) when there is no search field.
 * The active entry is indicated via `.entry.selected`, so we hide
 * the outline on the list container itself.
 */
.djs-popup-results:focus {
  outline: none;
}

.djs-popup-group {
  margin: 0;
  padding: 0;
  width: 100%;
}

.djs-popup-body .entry,
.djs-popup-body .entry-header {
  padding: 5px 7px;
  cursor: default;
  border-radius: 4px;
}

.djs-popup-body .entry-header {
  font-weight: var(--popup-header-font-weight);
  color: var(--popup-entry-title-color);
  padding-left: 0;
}

.djs-popup [class*="icon"] .djs-popup-label,
.djs-popup-label:not(:first-child) {
  margin-left: .5em;
}

.djs-popup [class*="icon"]:before,
.djs-popup-entry-icon {
  width: 1em;
  height: 1em;
  display: inline-block;
  font-size: 1.4em;
  vertical-align: middle;
}

.djs-popup-body .entry-header:not(:first-child) {
  margin-top: 8px;
  margin-bottom: 2px;
}

.djs-popup-body .entry {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  height: min-content;
}

.djs-popup .entry.selected {
  background-color: var(--popup-entry-hover-color);
}

.djs-popup .entry.disabled {
  color: var(--popup-disabled-color);
  cursor: not-allowed;
}

.djs-popup-body .entry:not(:first-child) {
  margin-top: 2px;
}

.djs-popup-entry-content {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.djs-popup-entry-description {
  font-size: var(--popup-secondary-font-size);
  margin-top: .25em;

  color: var(--popup-description-color);
}

.djs-popup-label,
.djs-popup-entry-description {
  line-height: 1.4em;
}

.djs-popup .entry,
.djs-popup .entry-header {
  margin: 1px;
}

.djs-popup-body {
  flex-direction: column;
  width: auto;
}

.djs-popup *::-webkit-scrollbar {
  width: 6px;
}

.djs-popup *::-webkit-scrollbar-thumb {
  border-radius: 3px;
  background-color: rgba(0, 0, 0, 0.2);
}

.djs-popup *::-webkit-scrollbar-track {
  box-shadow: none;
  background: transparent;
  margin: 0;
  padding: 5px;
}

.djs-popup-no-results {
  padding: 0 12px 12px 12px;
  color: var(--popup-no-results-color);
}

.djs-popup-footer {
  display: flex;
  padding: 5px 12px 7px 12px;
  border-top: solid 1px var(--popup-border-color);
}

/**
 * The footer holds the keyboard/assistive-technology reachable documentation
 * link. Mouse users get the per-entry `.djs-popup-entry-docs` affordance on
 * hover instead, so the (redundant) footer link is hidden while the results
 * list is hovered and shown during keyboard navigation.
 */
.djs-popup-results:hover ~ .djs-popup-footer {
  display: none;
}

.djs-popup-entry-docs {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  visibility: hidden;
  padding: 2px 3px;
  color: var(--popup-description-color);
  background: #fff;
  border: 1px solid var(--popup-search-border-color);
  border-radius: 4px;
  cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}

.djs-popup-body .entry:hover .djs-popup-entry-docs {
  visibility: visible;
}

.djs-popup-body .entry .djs-popup-entry-docs:hover {
  background: #f2f3f5;
}

.djs-popup-entry-docs svg {
  vertical-align: middle;
}

.djs-popup-footer-docs {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: var(--popup-secondary-font-size);
  color: var(--popup-description-color);
  text-decoration: none;
}

.djs-popup-footer-docs:hover {
  text-decoration: underline;
}

.djs-popup-footer-docs svg {
  vertical-align: middle;
  margin: 2px;
}

/**
 *  palette styles
 */
.djs-palette {
  background: var(--palette-background-color);
  border: solid 1px var(--palette-border-color);
  border-radius: 2px;
}

/**
 * bendpoints
 */
.djs-segment-dragger,
.djs-bendpoint {
  display: none;
}

.djs-segment-dragger .djs-visual {
  display: none;

  fill: var(--bendpoint-fill-color);
  stroke: var(--bendpoint-stroke-color);
  stroke-width: 1px;
  stroke-opacity: 1;
}

.djs-segment-dragger:hover .djs-visual {
  display: block;
}

.djs-bendpoint .djs-visual {
  fill: var(--bendpoint-fill-color);
  stroke: var(--bendpoint-stroke-color);
  stroke-width: 1px;
}

.djs-segment-dragger:hover,
.djs-bendpoints.hover .djs-segment-dragger,
.djs-bendpoints.selected .djs-segment-dragger,
.djs-bendpoint:hover,
.djs-bendpoints.hover .djs-bendpoint,
.djs-bendpoints.selected .djs-bendpoint {
  display: block;
}

.djs-drag-active .djs-bendpoints * {
  display: none;
}

.djs-bendpoints:not(.hover) .floating {
  display: none;
}

.djs-bendpoint.floating:not(.positioned) {
  display: none;
}

.djs-segment-dragger:hover .djs-visual,
.djs-segment-dragger.djs-dragging .djs-visual,
.djs-bendpoint:hover .djs-visual,
.djs-bendpoint.floating .djs-visual {
  fill: var(--bendpoint-fill-color);
  stroke: var(--bendpoint-stroke-color);
  stroke-opacity: 1;
}

.djs-bendpoint.floating .djs-hit {
  pointer-events: none;
}

.djs-segment-dragger .djs-hit,
.djs-bendpoint .djs-hit {
  fill: none;
  pointer-events: all;
}

.djs-segment-dragger.horizontal .djs-hit {
  cursor: ns-resize;
}

.djs-segment-dragger.vertical .djs-hit {
  cursor: ew-resize;
}

.djs-segment-dragger.djs-dragging .djs-hit {
  pointer-events: none;
}

.djs-updating,
.djs-updating > * {
  pointer-events: none !important;
}

.djs-updating .djs-context-pad,
.djs-updating .djs-outline,
.djs-updating .djs-bendpoint,
.djs-multi-select .djs-bendpoint,
.djs-multi-select .djs-segment-dragger,
.connect-ok .djs-bendpoint,
.connect-not-ok .djs-bendpoint,
.drop-ok .djs-bendpoint,
.drop-not-ok .djs-bendpoint {
  display: none !important;
}

.djs-segment-dragger.djs-dragging,
.djs-bendpoint.djs-dragging {
  display: block;
  opacity: 1.0;
}


/**
 * tooltips
 */
.djs-tooltip-error {
  width: 160px;
  padding: 6px;

  background: var(--tooltip-error-background-color);
  border: solid 1px var(--tooltip-error-border-color);
  border-radius: 2px;
  color: var(--tooltip-error-color);
  font-size: 12px;
  line-height: 16px;

  opacity: 0.75;
}

.djs-tooltip-error:hover {
  opacity: 1;
}


/**
 * search pad
 */
.djs-search-open .djs-context-pad {
  display: none;
}

.djs-search-open .djs-connection.selected .djs-outline {
  display: block;
}

.djs-search-container {
  position: absolute;
  top: 20px;
  left: 0;
  right: 0;
  margin-left: auto;
  margin-right: auto;

  width: 25%;
  min-width: 300px;
  max-width: 400px;
  z-index: 10;

  font-family: var(--search-font-family);
  font-size: var(--search-font-size);
  border-radius: 2px;
  box-shadow: 0px 2px 6px var(--search-shadow-color);
}

.djs-search-container:not(.open) {
  display: none;
}

.djs-search-input {
  position: relative;
}

.djs-search-input svg {
  position: absolute;
  left: 8px;
  top: 7px;
}

.djs-search-input input {
  font-size: var(--search-font-size);
  width: 100%;
  padding: 3px 6px 3px 28px;
  border: 1px solid var(--search-input-border-color);
  border-radius: 2px;
  box-sizing: border-box;
  line-height: 21px;
}

.djs-search-input input:focus {
  background-color: var(--search-input-focus-background-color);
  border: solid 1px var(--search-input-focus-border-color);
  outline: none;
}

.djs-search-results {
  position: relative;
  overflow-y: auto;
  max-height: 200px;
  background: var(--search-container-background-color);
}

.djs-search-result {
  padding: 6px 8px;
}

.djs-search-result-primary {
  margin: 0 0 3px;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
}

.djs-search-result-secondary {
  font-family: monospace;
  margin: 0;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
  color: var(--search-result-secondary-color);
}

.djs-search-result:hover {
  background: var(--search-result-hover-background-color);
}

.djs-search-result-selected {
  background: var(--search-result-hover-background-color);
}

.djs-search-result-selected:hover {
  background: var(--search-result-hover-background-color);
}

.djs-search-open .djs-element .djs-outline {
  fill: var(--search-preselected-background-color) !important;
}

/**
 * hidden styles
 */
.djs-element-hidden,
.djs-element-hidden .djs-hit,
.djs-element-hidden .djs-outline,
.djs-label-hidden .djs-label {
  display: none !important;
}

.djs-element .djs-hit-stroke,
.djs-element .djs-hit-click-stroke,
.djs-element .djs-hit-all {
  cursor: move;
}
/* bpmn-js.css */
.bjs-container {
  --bjs-font-family: Arial, sans-serif;

  --color-grey-225-10-15: hsl(225, 10%, 15%);
  --color-grey-225-10-35: hsl(225, 10%, 35%);
  --color-grey-225-10-55: hsl(225, 10%, 55%);
  --color-grey-225-10-75: hsl(225, 10%, 75%);
  --color-grey-225-10-80: hsl(225, 10%, 80%);
  --color-grey-225-10-85: hsl(225, 10%, 85%);
  --color-grey-225-10-90: hsl(225, 10%, 90%);
  --color-grey-225-10-95: hsl(225, 10%, 95%);
  --color-grey-225-10-97: hsl(225, 10%, 97%);

  --color-blue-205-100-45: hsl(205, 100%, 45%);
  --color-blue-205-100-45-opacity-30: hsla(205, 100%, 45%, 30%);
  --color-blue-205-100-50: hsl(205, 100%, 50%);
  --color-blue-205-100-95: hsl(205, 100%, 95%);

  --color-green-150-86-44: hsl(150, 86%, 44%);

  --color-red-360-100-40: hsl(360, 100%, 40%);
  --color-red-360-100-45: hsl(360, 100%, 45%);
  --color-red-360-100-92: hsl(360, 100%, 92%);
  --color-red-360-100-97: hsl(360, 100%, 97%);

  --color-white: hsl(0, 0%, 100%);
  --color-black: hsl(0, 0%, 0%);
  --color-black-opacity-05: hsla(0, 0%, 0%, 5%);
  --color-black-opacity-10: hsla(0, 0%, 0%, 10%);

  --breadcrumbs-font-family: var(--bjs-font-family);
  --breadcrumbs-item-color: var(--color-blue-205-100-50);
  --breadcrumbs-arrow-color: var(--color-black);
  --breadcrumbs-background-color: var(--color-grey-225-10-97);
  --breadcrumbs-border-color: var(--color-grey-225-10-75);
  --breadcrumbs-focus-outline-color: var(--color-blue-205-100-50);
  --drilldown-fill-color: var(--color-white);
  --drilldown-background-color: var(--color-blue-205-100-50);
  --drilldown-focus-outline-color: var(--color-blue-205-100-50);
}

.bjs-breadcrumbs {
  position: absolute;
  display: none;
  flex-wrap: wrap;
  align-items: center;
  top: 20px;
  left: 20px;
  padding: 5px 10px;
  margin: 0px;
  font-family: var(--breadcrumbs-font-family);
  font-size: 16px;
  line-height: normal;
  background-color: var(--breadcrumbs-background-color);
  border: solid 1px var(--breadcrumbs-border-color);
  border-radius: 2px;
  row-gap: 5px;
}

.bjs-breadcrumbs-shown .bjs-breadcrumbs {
  display: flex;
}

.djs-palette-shown .bjs-breadcrumbs {
  left: 90px;
}

.djs-palette-shown.djs-palette-two-column .bjs-breadcrumbs {
  left: 140px;
}

.bjs-breadcrumbs li {
  display: inline-flex;
  align-items: center;
}

.bjs-breadcrumbs a.bjs-crumb {
  cursor: pointer;
  color: var(--breadcrumbs-item-color);
  text-decoration: none;
}

.bjs-breadcrumbs a.bjs-crumb:focus-visible {
  outline: solid 1px var(--breadcrumbs-focus-outline-color);
  outline-offset: 1px;
}

.bjs-breadcrumbs li:not(:first-child)::before {
  content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" /><path d="M0 0h24v24H0z" fill="none" /></svg>');
  padding: 0 8px;
  color: var(--breadcrumbs-arrow-color);
  height: 1em;
}

.bjs-breadcrumbs .bjs-crumb {
  display: inline-block;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bjs-drilldown {
  width: 20px;
  height: 20px;

  padding: 0px;
  margin-left: -20px;

  cursor: pointer;
  border: none;
  border-radius: 2px;

  fill: var(--drilldown-fill-color);
  background-color: var(--drilldown-background-color);
}

.bjs-drilldown:focus-visible {
  outline: solid 1px var(--drilldown-focus-outline-color);
  outline-offset: 1px;
}

.bjs-drilldown-empty {
  display: none;
}

.selected .bjs-drilldown-empty {
  display: inherit;
}

[data-popup="align-elements"] .djs-popup-results {
  display: flex;
}

[data-popup="align-elements"] .djs-popup-body [data-group] + [data-group] {
  border-left: 1px solid var(--popup-border-color);
}

[data-popup="align-elements"] [data-group="align"] {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

[data-popup="align-elements"] .djs-popup-body .entry {
  padding: 6px 8px;
}

[data-popup="align-elements"] .djs-popup-body .entry:not(:first-child) {
  margin-top: 0;
}

[data-popup="align-elements"] .djs-popup-entry-icon {
  display: block;
  margin: 0;
  height: 20px;
  width: 20px;
}

#statusbar a:hover { color: var(--accent); }

/* ============================================================
   Modals & toasts
   ============================================================ */

.overlay {
  position: fixed; inset: 0;
  background: hsl(var(--shadow-color) / 0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  animation: fadein 0.12s ease;
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 420px;
  max-width: calc(100vw - 40px);
  max-height: calc(100vh - 60px);
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 50px -12px hsl(var(--shadow-color) / 0.35);
}
.modal.wide { width: 620px; }
.modal-head {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: 15px; font-weight: 700; }
.modal-close { cursor: pointer; color: var(--ink-faint); background: none; border: none; padding: 4px; }
.modal-close:hover { color: var(--ink); }
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-body p { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 12px; }
.modal-foot { padding: 12px 18px 16px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); }

.copy-area {
  width: 100%; min-height: 180px;
  font-family: var(--font-mono); font-size: 11px; line-height: 1.5;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px; color: var(--ink);
}

#toasts {
  position: fixed;
  right: 18px;
  bottom: 40px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 200;
  align-items: flex-end;
}
.toast {
  background: var(--ink);
  color: var(--bg);
  font-size: 12.5px;
  font-weight: 500;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  box-shadow: 0 10px 30px -8px hsl(var(--shadow-color) / 0.4);
  animation: toast-in 0.18s ease;
  max-width: 340px;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.toast.warn { background: var(--warn); color: #241a02; }
.toast.danger { background: var(--danger); color: #fff; }

/* ============================================================

   ============================================================ */

.djs-palette {
  border-color: var(--border) !important;

  box-shadow: 0 4px 14px -6px hsl(var(--shadow-color) / 0.3) !important;

.djs-palette .entry:hover { background: var(--accent-soft) !important; color: var(--accent-strong) !important; }
.djs-palette .separator { border-color: var(--border) !important; }

.djs-context-pad .entry:hover { background: var(--accent-soft); }

.bjs-powered-by {

.djs-minimap { border-color: var(--border) !important; background: var(--canvas-bg) !important; }

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function escapeHtml(str) {
    if (str === undefined || str === null) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function uid(prefix) {
    return (prefix || "id") + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }

  function nowIso() { return new Date().toISOString(); }

  function formatDate(iso) {
    if (!iso) return "—";
    try {
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) +
        " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    } catch (e) { return iso; }
  }

  function debounce(fn, ms) {
    var t = null;
    return function () {
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, ms);
    };
  }

  function humanizeType(type) {
    if (!type) return "Element";
    var t = type.replace(/^bpmn:/, "");
    return t.replace(/([a-z0-9])([A-Z])/g, "$1 $2");
  }

  function isGovernableType(type) {
    if (!type) return false;
    var t = type.replace(/^bpmn:/, "");
    for (var i = 0; i < GOVERNABLE_SUFFIXES.length; i++) {
      if (t.indexOf(GOVERNABLE_SUFFIXES[i]) !== -1) return true;
    }
    return false;
  }

  /* ---------------------------------------------------------------------
     2. Template / state codec (base64 in, base64 out — never touches the
        live DOM; see the note above buildPublishHtml for why)
     --------------------------------------------------------------------- */

  function b64ToUtf8(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function safeStateJson(state) {
    // Escaping every '<' (not just the closing script tag) means user-entered governance
    // text can never break the page's HTML when it is republished, and can
    // never inject markup either. < round-trips through JSON.parse untouched.
    return JSON.stringify(state).replace(/</g, "\\u003c");
  }

  /**
   * Builds the complete replacement page for artifact.publish(). Per the
   * artifact capability contract, document.documentElement.outerHTML must
   * NOT be used here — it would capture viewer-session state and any
   * runtime scripts the host has injected, plus (in this app specifically)
   * bpmn-js's large live-rendered SVG tree. Instead the page's own static
   * source is carried as a base64 template (inert — base64 text cannot
   * contain "<", so it can never be mistaken for markup) and only the
   * state slot is substituted, exactly as the page was originally authored.
   */
  function buildPublishHtml(state) {
    var b64 = $("#continuum-template-b64").textContent.trim();
    var template = b64ToUtf8(b64);
    var stateJson = safeStateJson(state);
    // .replace(string, value) — NOT split/join — replaces only the FIRST
    // occurrence. The template contains each token twice: once in the
    // shell's own script-tag slot (first, since those tags precede the
    // app.js block in document order) and once more inside app.js's own
    // source, where this same function's code is stored as text — that
    // second occurrence must survive untouched so the NEXT save can do
    // this substitution again. A global replace (split/join, or a regex
    // with /g) would corrupt app.js's own source on every republish.
    // The replacement is passed as a function, not a string, because a
    // literal "$&"/"$'" sequence inside user-entered governance text
    // would otherwise be misread as a String.replace pattern token.
    return template
      .replace("@@CONTINUUM_TEMPLATE_B64@@", function () { return b64; })
      .replace("@@CONTINUUM_STATE@@", function () { return stateJson; });
  }

  var STATE = (function loadInitialState() {

    try {

      if (parsed && parsed.processes) return parsed;

    return { processes: {}, order: [], activeId: null, meta: { updatedAt: nowIso() } };
  })();

  function ensureElementGov(proc, elementId) {
    if (!proc.elementGovernance) proc.elementGovernance = {};
    if (!proc.elementGovernance[elementId]) {
      proc.elementGovernance[elementId] = { ownerRole: "", inputs: "", outputs: "", kpiRefs: "", guardrail: { allow: "", deny: "", escalateIf: "" } };
    }
    return proc.elementGovernance[elementId];

  /* ---------------------------------------------------------------------
     4. Capabilities (artifact + downloads) — design for absence throughout
     --------------------------------------------------------------------- */

  function initCapabilities() {
    if (!window.claude || typeof window.claude.use !== "function") {
      capabilitiesReady = true;
      return Promise.resolve();
    }
    var artifactP = window.claude.use("artifact").catch(function () { return null; });
    var downloadsP = window.claude.use("downloads").catch(function () { return null; });
    return Promise.all([artifactP, downloadsP]).then(function (res) {
      claudeArtifact = res[0];
      claudeDownloads = res[1];
      capabilitiesReady = true;
      if (!claudeArtifact) {
        // No shared persistence available in this view — fall back to a
        // per-browser convenience so the tool still works standalone.
        try {
          var local = localStorage.getItem("continuum-studio-state-v1");
          if (local) {
            var parsedLocal = JSON.parse(local);
            if (parsedLocal && parsedLocal.meta && (!STATE.meta || parsedLocal.meta.updatedAt > STATE.meta.updatedAt)) {
              STATE = parsedLocal;
            }
          }
        } catch (e) { /* ignore corrupt local cache */ }
      }
    });
  }

  /* ---------------------------------------------------------------------

  function toast(msg, kind) {
    var root = $("#toasts");
    var el = document.createElement("div");
    el.className = "toast" + (kind ? " " + kind : "");
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () {
      el.style.transition = "opacity 0.25s ease";
      el.style.opacity = "0";
      setTimeout(function () { el.remove(); }, 260);
    }, 3200);
  }

  function openModal(innerHtml, onMount) {
    var root = $("#modal-root");
    root.innerHTML = '<div class="overlay" id="modal-overlay"><div class="modal" id="modal-box">' + innerHtml + "</div></div>";
    applyIcons(root);
    var overlay = $("#modal-overlay");
    overlay.addEventListener("mousedown", function (e) {
      if (e.target === overlay) closeModal();
    });
    document.addEventListener("keydown", modalEscHandler);
    if (onMount) onMount(root);
  }
  function modalEscHandler(e) {
    if (e.key === "Escape") closeModal();
  }
  function closeModal() {
    $("#modal-root").innerHTML = "";
    document.removeEventListener("keydown", modalEscHandler);
  }

  /* ---------------------------------------------------------------------
     6. Modeler bootstrap
     --------------------------------------------------------------------- */

  function initModeler() {
    modeler = new window.BpmnJS({ container: "#canvas" });
    modeler.on("selection.changed", function (e) {
      lastSelection = e.newSelection || [];
      renderPanel();
      renderStatusBarSelection();
    });
    modeler.on("commandStack.changed", function () {
      markDirty();
      renderStatusBarCounts();
    });
    modeler.on("import.done", function (evt) {
      if (evt.error) {
        toast("Could not render this diagram: " + evt.error.message, "danger");
        return;
      }
      var canvas = modeler.get("canvas");
      canvas.zoom("fit-viewport");
      updateZoomLabel();
      renderStatusBarCounts();
    });
    var canvas = modeler.get("canvas");
    canvas.on && modeler.get("eventBus").on("canvas.viewbox.changed", updateZoomLabel);
  }

  function updateZoomLabel() {
    try {
      var z = modeler.get("canvas").zoom();
      $("#zoom-label").textContent = Math.round(z * 100) + "%";
    } catch (e) { /* modeler not ready */ }
  }

  function loadProcessIntoModeler(proc) {
    var p;
    if (proc.bpmnXml) {
      p = modeler.importXML(proc.bpmnXml);
    } else {
      p = modeler.createDiagram().then(function () {
        return modeler.saveXML({ format: false }).then(function (res) {
          proc.bpmnXml = res.xml;
        });
      });
    }
    return p.catch(function (err) {
      toast("Import failed for “" + proc.name + "”: " + err.message, "danger");
    });
  }

  function captureCurrentXml() {
    if (!modeler || !getActive()) return Promise.resolve();
    return modeler.saveXML({ format: false }).then(function (res) {
      var proc = getActive();
      if (proc) proc.bpmnXml = res.xml;
    }).catch(function () { /* leave last-known xml in place */ });
  }

  /* ---------------------------------------------------------------------
     7. Process CRUD
     --------------------------------------------------------------------- */

  function switchToProcess(id) {
    if (id === STATE.activeId) return;
    var doSwitch = function () {
      STATE.activeId = id;
      var proc = getActive();
      lastSelection = [];
      renderLibrary();
      renderTopbarTitle();
      renderStatusBarMeta();
      loadProcessIntoModeler(proc).then(function () {
        activeTab = "general";
        renderPanelTabs();
        renderPanel();
        refreshActiveView();
      });
    };
    if (STATE.activeId && modeler) {
      captureCurrentXml().then(doSwitch);
    } else {
      doSwitch();
    }
  }

  function blankGovernance() {
    return {
      apqcCode: "", ownerRole: "", inputs: "", outputs: "",
      kpiRefs: "", riskRefs: "", maturityScore: 1, status: "draft",
      guardrail: { allow: "", deny: "", escalateIf: "" },
      notes: "",
      reviewer: "", reviewDate: "", nextReviewDue: "",
      approvedBy: "", approvedDate: ""
    };
  }

  function createNewProcess(details) {
    var id = uid("proc");
    var ts = nowIso();
    var proc = Object.assign({
      id: id,
      name: details.name || "Untitled process",
      version: 1,
      bpmnXml: "",
      elementGovernance: {},
      history: [{ version: 1, savedAt: ts, note: "Created" }],
      createdAt: ts,
      updatedAt: ts
    }, blankGovernance(), {
      apqcCode: details.apqcCode || "",
      ownerRole: details.ownerRole || ""
    });
    STATE.processes[id] = proc;
    STATE.order.unshift(id);
    switchToProcess(id);
    markDirty();
    toast("Created “" + proc.name + "”");
  }

  function deleteProcess(id) {
    var proc = STATE.processes[id];
    if (!proc) return;
    delete STATE.processes[id];
    STATE.order = STATE.order.filter(function (x) { return x !== id; });
    if (STATE.activeId === id) {
      STATE.activeId = STATE.order[0] || null;
    }
    markDirty();
    renderLibrary();
    if (STATE.activeId) {
      var next = getActive();
      loadProcessIntoModeler(next).then(function () {
        renderTopbarTitle();
        renderStatusBarMeta();
        renderPanel();
        refreshActiveView();
      });
    } else {
      $("#canvas").innerHTML = "";
      modeler = null;
      initModeler();
      renderTopbarTitle();
      renderStatusBarMeta();
      renderPanel();
      refreshActiveView();
    }
    toast("Deleted “" + proc.name + "”");
  }

  }

  function updateSaveIndicator() {
    if (dirty) setSaveState("dirty", "Unsaved changes");
    else setSaveState("saved", "Saved");
  }

  function pruneOrphanedGovernance(proc) {
    if (!modeler || !proc.elementGovernance) return;
    try {
      var registry = modeler.get("elementRegistry");
      var live = {};
      registry.getAll().forEach(function (el) { live[el.id] = true; });
      Object.keys(proc.elementGovernance).forEach(function (elId) {
        if (!live[elId]) delete proc.elementGovernance[elId];
      });
    } catch (e) { /* non-fatal */ }
  }

  function doSave() {
    if (!getActive()) { toast("Nothing to save yet — create a process first."); return; }
    setSaveState("saving", "Saving…");
    captureCurrentXml().then(function () {
      var proc = getActive();
      pruneOrphanedGovernance(proc);
      proc.updatedAt = nowIso();
      proc.version = (proc.version || 1) + 1;
      proc.history = proc.history || [];
      proc.history.unshift({ version: proc.version, savedAt: proc.updatedAt, note: "Saved from Continuum Studio" });
      if (proc.history.length > 25) proc.history.length = 25;
      STATE.meta = { updatedAt: proc.updatedAt };

      if (claudeArtifact) {
        var html = buildPublishHtml(STATE);
        claudeArtifact.publish(html).then(function () {
          dirty = false;
          setSaveState("saved", "Saved · v" + proc.version);
          renderStatusBarMeta();
          renderLibrary();
        }).catch(function (err) {
          if (err && err.code === "conflict") {
            toast("Someone published a newer version — reloading.", "warn");
            return;
          }
          dirty = true;
          setSaveState("dirty", "Save failed");
          toast("Save failed: " + (err && err.message ? err.message : "unknown error"), "danger");
        });
      } else {
        try {
          localStorage.setItem("continuum-studio-state-v1", JSON.stringify(STATE));
          dirty = false;
          setSaveState("saved", "Saved locally · v" + proc.version);
          toast("Saved in this browser. Sharing/sync isn’t available in this view.");
        } catch (e) {
          setSaveState("dirty", "Save failed");
          toast("Could not save locally: " + e.message, "danger");
        }
        renderStatusBarMeta();
        renderLibrary();
      }
    });
  }

  function suggestFilename(proc, ext) {
    var base = (proc.name || "process").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return (base || "continuum-process") + "." + ext;
  }

  function offerDownload(filename, data, mime) {
    if (claudeDownloads) {
      claudeDownloads.save({ filename: filename, data: data }).then(function () {
        toast("Saved " + filename);
      }).catch(function (err) {
        if (err && err.code === "declined") return;
        openCopyFallback(filename, data);
      });
    } else {
      openCopyFallback(filename, data);
    }
  }

  function openCopyFallback(filename, data) {
    openModal(
      '<div class="modal-head"><span class="modal-title">' + escapeHtml(filename) + '</span>' +
      '<button class="modal-close" id="modal-x"><span class="ic" data-icon="close"></span></button></div>' +
      '<div class="modal-body"><p>Downloads aren’t available in this view. Copy the contents below instead.</p>' +
      '<textarea class="copy-area" id="copy-text" readonly></textarea></div>' +
      '<div class="modal-foot"><button class="btn primary" id="copy-btn"><span class="ic" data-icon="copy"></span> Copy to clipboard</button></div>',
      function (root) {
        $("#copy-text", root).value = data;
        $("#modal-x", root).onclick = closeModal;
        $("#copy-btn", root).onclick = function () {
          navigator.clipboard.writeText(data).then(function () {
            toast("Copied " + filename + " to clipboard");
            closeModal();
          }).catch(function () {
            $("#copy-text", root).select();
            toast("Select-all applied — copy with Ctrl/Cmd+C");
          });
        };
      }
    );
  }

  function openExportModal() {
    var proc = getActive();
    if (!proc) { toast("Nothing to export yet."); return; }
    openModal(
      '<div class="modal-head"><span class="modal-title">Export “' + escapeHtml(proc.name) + '”</span>' +
      '<button class="modal-close" id="modal-x"><span class="ic" data-icon="close"></span></button></div>' +
      '<div class="modal-body"><p>BPMN 2.0 XML is a plain, standards-based export — it opens cleanly in Camunda Modeler, Visio’s BPMN add-ins, or any other BPMN tool. Continuum’s governance fields (APQC, owner, guardrails, maturity) are Continuum’s own record and travel with the process library, not inside the BPMN file — keeping the exchange format portable.</p>' +
      '<div class="select-btn-row">' +
      '<button class="btn primary full" id="exp-xml"><span class="ic" data-icon="download"></span> BPMN 2.0 XML (.bpmn)</button>' +
      '</div><div class="select-btn-row"><button class="btn full" id="exp-svg"><span class="ic" data-icon="download"></span> Diagram as SVG</button></div>' +
      '<div class="select-btn-row"><button class="btn full" id="exp-json"><span class="ic" data-icon="download"></span> Governance &amp; task context (.json)</button></div>' +
      '<p style="margin-top:10px;">The JSON export is this process’s full Continuum record — owner, APQC classification, guardrails, doc-control fields, and every task’s governance override — the same shape a <code>get_task_context</code> / <code>check_guardrail</code> agent binding would read. See continuum-core-model.md §03 and §07.</p>' +
      "</div>",
      function (root) {
        $("#modal-x", root).onclick = closeModal;
        $("#exp-xml", root).onclick = function () {
          modeler.saveXML({ format: true }).then(function (res) {
            closeModal();
            offerDownload(suggestFilename(proc, "bpmn"), res.xml);
          });
        };
        $("#exp-svg", root).onclick = function () {
          modeler.saveSVG().then(function (res) {
            closeModal();
            offerDownload(suggestFilename(proc, "svg"), res.svg);
          });
        };
        $("#exp-json", root).onclick = function () {
          captureCurrentXml().then(function () {
            var exportRecord = {
              schema: "continuum.process-export.v1",
              exportedAt: nowIso(),
              process: proc
            };
            closeModal();
            offerDownload(suggestFilename(proc, "json"), JSON.stringify(exportRecord, null, 2));
          });
        };
      }
    );
  }

  function openImportPicker() {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".bpmn,.xml,text/xml,application/xml";
    input.style.display = "none";
    document.body.appendChild(input);
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      document.body.removeChild(input);
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var xml = reader.result;
        var name = file.name.replace(/\.(bpmn|xml)$/i, "");
        modeler.importXML(xml).then(function (res) {
          var id = uid("proc");
          var ts = nowIso();
          var proc = Object.assign({
            id: id, name: name || "Imported process", version: 1, bpmnXml: xml,
            elementGovernance: {}, history: [{ version: 1, savedAt: ts, note: "Imported from " + file.name }],
            createdAt: ts, updatedAt: ts
          }, blankGovernance());
          STATE.processes[id] = proc;
          STATE.order.unshift(id);
          STATE.activeId = id;
          markDirty();
          renderLibrary();
          renderTopbarTitle();
          renderStatusBarMeta();
          activeTab = "general";
          renderPanelTabs();
          renderPanel();
          refreshActiveView();
          var warnCount = (res.warnings || []).length;
          toast("Imported “" + proc.name + "”" + (warnCount ? " with " + warnCount + " warning(s)" : ""), warnCount ? "warn" : null);
        }).catch(function (err) {
          toast("Import failed — this doesn’t look like valid BPMN 2.0 XML (" + err.message + ")", "danger");
        });
      };
      reader.readAsText(file);
    });
    input.click();
  }

  /* ---------------------------------------------------------------------
     9. Rendering — library rail
     --------------------------------------------------------------------- */

  function maturityDots(score) {
    var out = "";
    for (var i = 1; i <= 5; i++) out += '<span class="' + (i <= (score || 0) ? "on" : "") + '"></span>';
    return '<span class="maturity-dots" title="ISO 9004 maturity ' + (score || 0) + '/5">' + out + "</span>";
  }

  function renderLibrary() {
    var list = $("#process-list");
    if (!STATE.order.length) {
      list.innerHTML = '<div class="empty-panel">No processes yet.<br>Click <strong>New</strong> to start modeling, or <strong>Import</strong> an existing BPMN 2.0 file.</div>';
      return;
    }
    var html = "";
    STATE.order.forEach(function (id) {
      var p = STATE.processes[id];
      if (!p) return;
      var statusMeta = STATUS_META[p.status] || STATUS_META.draft;
      html += '<div class="proc-card' + (id === STATE.activeId ? " active" : "") + '" data-id="' + id + '">' +
        '<div class="proc-card-name">' + escapeHtml(p.name) + "</div>" +
        '<div class="proc-card-meta">' +
        (p.apqcCode ? '<span class="chip" title="' + escapeHtml(apqcLabelFor(p.apqcCode)) + '">APQC ' + escapeHtml(p.apqcCode) + "</span>" : "") +
        '<span class="chip status-' + p.status + '">' + statusMeta.label + "</span>" +
        maturityDots(p.maturityScore) +
        "</div></div>";
    });
    list.innerHTML = html;
    $all(".proc-card", list).forEach(function (card) {
      card.addEventListener("click", function () { switchToProcess(card.getAttribute("data-id")); });
    });
  }

  function renderTopbarTitle() {
    var proc = getActive();
    var input = $("#process-title");
    input.value = proc ? proc.name : "";
    input.disabled = !proc;
  }

  /* ---------------------------------------------------------------------
     10. Rendering — status bar
     --------------------------------------------------------------------- */

  function renderStatusBarMeta() {
    var proc = getActive();
    $("#sb-version").textContent = proc ? "v" + proc.version : "—";
    $("#sb-apqc").textContent = proc && proc.apqcCode
      ? "APQC " + proc.apqcCode + " · " + apqcLabelFor(proc.apqcCode)
      : "APQC — unclassified";
  }

  function renderStatusBarCounts() {
    if (!modeler) { $("#sb-elements").textContent = "— elements"; return; }
    try {
      var all = modeler.get("elementRegistry").getAll().filter(function (e) { return e.type !== "label"; });
      $("#sb-elements").textContent = all.length + " element" + (all.length === 1 ? "" : "s");
    } catch (e) { /* ignore */ }
  }

  function renderStatusBarSelection() {
    if (!lastSelection.length) { $("#sb-selection").textContent = "No selection"; return; }
    if (lastSelection.length === 1) {
      var el = lastSelection[0];
      $("#sb-selection").textContent = humanizeType(el.type) + (el.businessObject && el.businessObject.name ? ": " + el.businessObject.name : " (" + el.id + ")");
    } else {
      $("#sb-selection").textContent = lastSelection.length + " elements selected";
    }
  }

  /* ---------------------------------------------------------------------
     11. Rendering — governance panel
     --------------------------------------------------------------------- */

  function renderPanelTabs() {
    $all(".panel-tab").forEach(function (t) {
      t.classList.toggle("active", t.getAttribute("data-tab") === activeTab);
    });
  }

  function selectedElement() {
    if (lastSelection.length !== 1) return null;
    var el = lastSelection[0];
    if (el.type === "label") return null;
    return el;
  }

  function renderPanel() {
    var proc = getActive();
    var body = $("#panel-body");
    if (!proc) {
      body.innerHTML = '<div class="empty-panel">Select or create a process to see its governance record — APQC classification, accountable owner, KPIs, and the guardrail policy an agent binding would read.</div>';
      return;
    }
    var el = selectedElement();
    if (activeTab === "general") {
      body.innerHTML = el ? renderGeneralElement(el) : renderGeneralProcess(proc);
    } else {
      body.innerHTML = el ? renderGovernanceElement(proc, el) : renderGovernanceProcess(proc);
    }
    wirePanelInputs(proc, el);
  }

  function renderGeneralElement(el) {
    var bo = el.businessObject || {};
    return (
      '<div class="field-group">' +
      '<div class="field-group-title">Element</div>' +
      '<div class="field"><label for="f-el-name">Name</label><input type="text" id="f-el-name" value="' + escapeHtml(bo.name || "") + '" placeholder="Unnamed"></div>' +
      '<div class="field"><label>Type</label><div class="mono-id">' + escapeHtml(humanizeType(el.type)) + "</div></div>" +
      '<div class="field"><label>Element ID</label><div class="mono-id">' + escapeHtml(el.id) + "</div></div>" +
      "</div>"
    );
  }

  function renderGeneralProcess(proc) {
    return (
      '<div class="field-group">' +
      '<div class="field-group-title">Process</div>' +
      '<div class="field"><label for="f-proc-name">Name</label><input type="text" id="f-proc-name" value="' + escapeHtml(proc.name) + '"></div>' +
      '<div class="field"><label for="f-proc-notes">Notes</label><textarea id="f-proc-notes" placeholder="What this process is for, scope, exclusions…">' + escapeHtml(proc.notes || "") + "</textarea></div>" +
      '<div class="field-row"><div class="field"><label>Created</label><div class="mono-id">' + formatDate(proc.createdAt) + '</div></div>' +
      '<div class="field"><label>Updated</label><div class="mono-id">' + formatDate(proc.updatedAt) + "</div></div></div>" +
      "</div>" +
      '<div class="field-group">' +
      '<div class="field-group-title">Version history</div>' +
      (proc.history || []).slice(0, 6).map(function (h) {
        return '<div class="field" style="margin-bottom:6px;"><div class="mono-id">v' + h.version + " · " + formatDate(h.savedAt) + (h.note ? " — " + escapeHtml(h.note) : "") + "</div></div>";
      }).join("") +
      "</div>"
    );

  function maturityPicker(id, current) {
    var labels = ["1 · Initial", "2 · Developing", "3 · Defined", "4 · Managed", "5 · Optimizing"];
    var html = '<div class="maturity-picker" id="' + id + '">';
    for (var i = 1; i <= 5; i++) {
      html += '<div class="maturity-opt' + (current === i ? " selected" : "") + '" data-val="' + i + '" title="' + labels[i - 1] + '">' + i + "</div>";
    }
    html += "</div>";
    return html;

  function renderGovernanceProcess(proc) {
    var currentCat = apqcCategoryOf(proc.apqcCode);
    var catOptions = '<option value="">— Unclassified —</option>' + APQC_TAXONOMY.map(function (c) {
      return '<option value="' + c.code + '"' + (currentCat && currentCat.code === c.code ? " selected" : "") + ">" + c.code + " " + escapeHtml(c.label) + "</option>";
    }).join("");
    var groupOptions = '<option value="">— Category only —</option>' + (currentCat ? currentCat.groups.map(function (g) {
      return '<option value="' + g.code + '"' + (proc.apqcCode === g.code ? " selected" : "") + ">" + g.code + " " + escapeHtml(g.label) + "</option>";
    }).join("") : "");
    var statusOptions = Object.keys(STATUS_META).map(function (s) {
      return '<option value="' + s + '"' + (proc.status === s ? " selected" : "") + ">" + STATUS_META[s].label + "</option>";
    }).join("");
    var g = proc.guardrail || { allow: "", deny: "", escalateIf: "" };
    return (
      '<div class="field-group"><div class="field-group-title">Classification · APQC PCF</div>' +
      '<div class="field"><label for="f-apqc-cat">Category (Level 1)</label><select id="f-apqc-cat">' + catOptions + "</select></div>" +
      '<div class="field"><label for="f-apqc-group">Process group (Level 2)</label><select id="f-apqc-group"' + (currentCat ? "" : " disabled") + ">" + groupOptions + "</select>" +
      '<div class="hint">The join key threading this process to its KPIs and guardrails — see continuum-core-model.md §10.</div></div>' +
      '<div class="field"><label for="f-status">Status</label><select id="f-status">' + statusOptions + "</select></div>" +
      "</div>" +
      '<div class="field-group"><div class="field-group-title">Accountability &amp; flow · ISO 9001 §4.4</div>' +
      '<div class="field"><label for="f-owner">Process owner</label><input type="text" id="f-owner" placeholder="e.g. VP Operations" value="' + escapeHtml(proc.ownerRole) + '"></div>' +
      '<div class="field"><label for="f-inputs">Inputs</label><input type="text" id="f-inputs" placeholder="Comma-separated" value="' + escapeHtml(proc.inputs) + '"></div>' +
      '<div class="field"><label for="f-outputs">Outputs</label><input type="text" id="f-outputs" placeholder="Comma-separated" value="' + escapeHtml(proc.outputs) + '"></div>' +
      "</div>" +
      '<div class="field-group"><div class="field-group-title">Measurement &amp; risk</div>' +
      '<div class="field"><label for="f-kpi">KPI references</label><input type="text" id="f-kpi" placeholder="Comma-separated" value="' + escapeHtml(proc.kpiRefs) + '"></div>' +
      '<div class="field"><label for="f-risk">Risk references</label><input type="text" id="f-risk" placeholder="Comma-separated" value="' + escapeHtml(proc.riskRefs) + '"></div>' +
      "</div>" +
      '<div class="field-group"><div class="field-group-title">ISO 9004 maturity self-assessment</div>' +

      "</div>" +
      '<div class="field-group"><div class="field-group-title">Guardrail policy — default for every task below</div>' +
      '<div class="guardrail-box">' +
      '<div class="guardrail-row"><span class="guardrail-tag allow">Allow</span><textarea id="f-g-allow" placeholder="What an agent bound to this process may do">' + escapeHtml(g.allow) + "</textarea></div>" +
      '<div class="guardrail-row"><span class="guardrail-tag deny">Deny</span><textarea id="f-g-deny" placeholder="Explicit deny-list, kept separate from “everything else”">' + escapeHtml(g.deny) + "</textarea></div>" +
      '<div class="guardrail-row"><span class="guardrail-tag escalate">Escalate</span><textarea id="f-g-escalate" placeholder="Condition that routes to a human">' + escapeHtml(g.escalateIf) + "</textarea></div>" +
      "</div><div class=\"hint\">Inherited by every task in this process unless a task defines its own override.</div></div>" +
      '<div class="field-group"><div class="field-group-title">Document control · ISO 9001 §7.5</div>' +
      '<div class="field-row">' +
      '<div class="field"><label for="f-reviewer">Reviewer</label><input type="text" id="f-reviewer" placeholder="Who reviews this record" value="' + escapeHtml(proc.reviewer || "") + '"></div>' +

  function renderGovernanceElement(proc, el) {
