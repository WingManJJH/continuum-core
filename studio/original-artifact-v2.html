  function wirePanelInputs(proc, el) {
    function on(id, evt, fn) { var n = $(id); if (n) n.addEventListener(evt, fn); }

    if (activeTab === "general" && el) {
      on("#f-el-name", "input", debounce(function () {
        try { modeler.get("modeling").updateProperties(el, { name: $("#f-el-name").value }); } catch (e) {}
        markDirty();
      }, 250));
    }
    if (activeTab === "general" && !el) {
      on("#f-proc-name", "input", debounce(function () {
        proc.name = $("#f-proc-name").value || "Untitled process";
        renderTopbarTitle();
        renderLibrary();
        markDirty();
      }, 200));
      on("#f-proc-notes", "input", debounce(function () { proc.notes = $("#f-proc-notes").value; markDirty(); }, 250));
    }
    if (activeTab === "governance" && !el) {
      on("#f-apqc-cat", "change", function () {
        proc.apqcCode = $("#f-apqc-cat").value; // reset to category-level; group is re-picked below
        renderPanel();
        renderLibrary();
        renderStatusBarMeta();
        markDirty();
      });
      on("#f-apqc-group", "change", function () {
        var groupCode = $("#f-apqc-group").value;
        var catCode = $("#f-apqc-cat").value;
        proc.apqcCode = groupCode || catCode;
        renderLibrary();
        renderStatusBarMeta();
        markDirty();
      });
      on("#f-status", "change", function () { proc.status = $("#f-status").value; renderLibrary(); markDirty(); });
      on("#f-owner", "input", debounce(function () { proc.ownerRole = $("#f-owner").value; markDirty(); }, 200));
      on("#f-inputs", "input", debounce(function () { proc.inputs = $("#f-inputs").value; markDirty(); }, 200));
      on("#f-outputs", "input", debounce(function () { proc.outputs = $("#f-outputs").value; markDirty(); }, 200));
      on("#f-kpi", "input", debounce(function () { proc.kpiRefs = $("#f-kpi").value; markDirty(); }, 200));
      on("#f-risk", "input", debounce(function () { proc.riskRefs = $("#f-risk").value; markDirty(); }, 200));
      on("#f-g-allow", "input", debounce(function () { proc.guardrail.allow = $("#f-g-allow").value; markDirty(); }, 200));
      on("#f-g-deny", "input", debounce(function () { proc.guardrail.deny = $("#f-g-deny").value; markDirty(); }, 200));
      on("#f-g-escalate", "input", debounce(function () { proc.guardrail.escalateIf = $("#f-g-escalate").value; markDirty(); }, 200));
      on("#f-reviewer", "input", debounce(function () { proc.reviewer = $("#f-reviewer").value; markDirty(); }, 200));
      on("#f-review-date", "change", function () { proc.reviewDate = $("#f-review-date").value; markDirty(); });
      on("#f-next-review", "change", function () { proc.nextReviewDue = $("#f-next-review").value; markDirty(); });
      on("#f-approved-date", "change", function () { proc.approvedDate = $("#f-approved-date").value; markDirty(); });
      on("#f-approved-by", "input", debounce(function () { proc.approvedBy = $("#f-approved-by").value; markDirty(); }, 200));
      $all(".maturity-opt", $("#f-maturity")).forEach(function (opt) {
        opt.addEventListener("click", function () {
          proc.maturityScore = parseInt(opt.getAttribute("data-val"), 10);
          renderPanel();
          renderLibrary();
          markDirty();
        });
      });
    }
    if (activeTab === "governance" && el && isGovernableType(el.type)) {
      var eg = ensureElementGov(proc, el.id);
      on("#f-el-owner", "input", debounce(function () { eg.ownerRole = $("#f-el-owner").value; markDirty(); }, 200));
      on("#f-el-in", "input", debounce(function () { eg.inputs = $("#f-el-in").value; markDirty(); }, 200));
      on("#f-el-out", "input", debounce(function () { eg.outputs = $("#f-el-out").value; markDirty(); }, 200));
      on("#f-el-kpi", "input", debounce(function () { eg.kpiRefs = $("#f-el-kpi").value; markDirty(); }, 200));
      on("#f-el-g-allow", "input", debounce(function () { eg.guardrail.allow = $("#f-el-g-allow").value; markDirty(); }, 200));
      on("#f-el-g-deny", "input", debounce(function () { eg.guardrail.deny = $("#f-el-g-deny").value; markDirty(); }, 200));
      on("#f-el-g-escalate", "input", debounce(function () { eg.guardrail.escalateIf = $("#f-el-g-escalate").value; markDirty(); }, 200));
    }
  }

  /* ---------------------------------------------------------------------
     12. New-process modal
     --------------------------------------------------------------------- */

  function openNewProcessModal() {
    var apqcOptions = '<option value="">— Choose later —</option>' + APQC_TAXONOMY.map(function (c) {
      return '<option value="' + c.code + '">' + c.code + " " + escapeHtml(c.label) + "</option>";
    }).join("");
    openModal(
      '<div class="modal-head"><span class="modal-title">New process</span>' +
      '<button class="modal-close" id="modal-x"><span class="ic" data-icon="close"></span></button></div>' +
      '<div class="modal-body">' +
      '<div class="field"><label for="np-name">Name</label><input type="text" id="np-name" placeholder="e.g. Purchase Requisition Approval" autofocus></div>' +
      '<div class="field"><label for="np-apqc">APQC category</label><select id="np-apqc">' + apqcOptions + "</select></div>" +
      '<div class="field"><label for="np-owner">Process owner</label><input type="text" id="np-owner" placeholder="e.g. Procurement Lead"></div>' +
      "</div>" +
      '<div class="modal-foot"><button class="btn" id="np-cancel">Cancel</button><button class="btn primary" id="np-create">Create process</button></div>',
      function (root) {
        $("#modal-x", root).onclick = closeModal;
        $("#np-cancel", root).onclick = closeModal;
        $("#np-name", root).focus();
        function submit() {
          var name = $("#np-name", root).value.trim();
          createNewProcess({
            name: name || "Untitled process",
            apqcCode: $("#np-apqc", root).value,
            ownerRole: $("#np-owner", root).value.trim()
          });
          closeModal();
        }
        $("#np-create", root).onclick = submit;
        $("#np-name", root).addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
      }
    );
  }

  function openDeleteConfirm(id) {
    var proc = STATE.processes[id];
    if (!proc) return;
    openModal(
      '<div class="modal-head"><span class="modal-title">Delete process</span>' +
      '<button class="modal-close" id="modal-x"><span class="ic" data-icon="close"></span></button></div>' +
      '<div class="modal-body"><p>Delete “' + escapeHtml(proc.name) + '” permanently? This removes its diagram and governance record from the library. This can’t be undone.</p></div>' +
      '<div class="modal-foot"><button class="btn" id="del-cancel">Cancel</button><button class="btn danger" id="del-confirm"><span class="ic" data-icon="trash"></span> Delete</button></div>',
      function (root) {
        $("#modal-x", root).onclick = closeModal;
        $("#del-cancel", root).onclick = closeModal;
        $("#del-confirm", root).onclick = function () { deleteProcess(id); closeModal(); };
      }
    );
  }

  /* ---------------------------------------------------------------------
     13. Multi-view rendering — the same process object, rendered as a
         BPMN diagram, a RACI matrix, and a metro map. All three read the
         live diagram (via elementRegistry / the BPMN moddle tree) plus
         the governance record; none of them are a separate data model.
     --------------------------------------------------------------------- */

  function switchView(view) {
    if (view === activeView) return;
    activeView = view;
    $all(".view-btn").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-view") === view); });
    $all(".view-pane").forEach(function (p) { p.classList.toggle("active", p.id === "view-" + view); });
    $all("#tbg-undo, #tbg-align, #tbg-zoom").forEach(function (g) { if (g) g.classList.toggle("view-disabled", view !== "diagram"); });
    if (view === "diagram") {
      try { modeler && modeler.get("canvas").resized(); } catch (e) { /* modeler not ready */ }
    } else {
      refreshActiveView();
    }
  }

  function refreshActiveView() {
    var proc = getActive();
    if (activeView === "raci") renderRaciView(proc);
    else if (activeView === "metro") renderMetroView(proc);
  }

  // Walks the BPMN semantic model (not the diagram-js shape tree — lane
  // membership is a semantic relationship, laneSet.lanes[].flowNodeRef,
  // not a geometric parent/child one) to map each flow node id to the
  // name of the lane (role) it sits in. Handles both a plain bpmn:Process
  // root and a bpmn:Collaboration of Participants, and processes with no
  // lanes at all (returns an empty map — every element is "Unassigned").
  function buildLaneIndex() {
    var index = {};
    if (!modeler) return index;
    try {
      var canvas = modeler.get("canvas");
      var rootBo = canvas.getRootElement().businessObject;
      var procs = [];
      if (rootBo && rootBo.$type === "bpmn:Collaboration") {
        (rootBo.participants || []).forEach(function (p) { if (p.processRef) procs.push(p.processRef); });
      } else if (rootBo) {
        procs.push(rootBo);
      }
      procs.forEach(function (p) {
        (p.laneSets || []).forEach(function (laneSet) {
          (laneSet.lanes || []).forEach(function (lane) {
            (lane.flowNodeRef || []).forEach(function (ref) {
              var id = typeof ref === "string" ? ref : (ref && ref.id);
              if (id) index[id] = lane.name || "Unnamed lane";
            });
          });
        });
      });
    } catch (e) { /* no lanes, or root not ready */ }
    return index;
  }

  function isRaciRowType(t) {
    return /(^|[A-Za-z])Task$|SubProcess$|CallActivity$/.test(t) && t !== "TextAnnotation";
  }

  function computeRaci(proc) {
    var result = { rows: [], roles: [] };
    if (!modeler || !proc) return result;
    var laneIndex = buildLaneIndex();
    var roleSeen = {};
    function addRole(r) { if (r && !roleSeen[r]) { roleSeen[r] = true; result.roles.push(r); } }
    try {
      var canvas = modeler.get("canvas");
      var rootBo = canvas.getRootElement().businessObject;
      var procs = rootBo && rootBo.$type === "bpmn:Collaboration"
        ? (rootBo.participants || []).map(function (p) { return p.processRef; }).filter(Boolean)
        : (rootBo ? [rootBo] : []);
      procs.forEach(function (p) {
        (p.laneSets || []).forEach(function (ls) {
          (ls.lanes || []).forEach(function (lane) { addRole(lane.name || "Unnamed lane"); });
        });
      });
    } catch (e) { /* fall through with whatever roles tasks contribute below */ }

    modeler.get("elementRegistry").getAll().forEach(function (el) {
      if (el.type === "label") return;
      var t = el.type.replace(/^bpmn:/, "");
      if (!isRaciRowType(t)) return;
      var eg = (proc.elementGovernance && proc.elementGovernance[el.id]) || {};
      var laneRole = laneIndex[el.id] || "";
      var ownerRole = eg.ownerRole || proc.ownerRole || "";
      addRole(laneRole);
      addRole(ownerRole);
      result.rows.push({
        id: el.id,
        name: (el.businessObject && el.businessObject.name) || "(unnamed " + humanizeType(el.type).toLowerCase() + ")",
        laneRole: laneRole,
        ownerRole: ownerRole
      });
    });
    return result;
  }

  function renderRaciView(proc) {
    var host = $("#raci-content");
    if (!host) return;
    if (!proc) { host.innerHTML = '<div class="empty-panel">Select or create a process to see its RACI matrix.</div>'; return; }
    var data = computeRaci(proc);
    if (!data.rows.length) {
      host.innerHTML = '<div class="empty-panel">No tasks yet — the RACI matrix derives its rows from Task, Sub-process, and Call-activity shapes on the diagram. Add some and switch back here.</div>';
      return;
    }
    if (!data.roles.length) {
      host.innerHTML = '<div class="empty-panel">Add pool lanes, or set a process/task owner in the Governance tab, to populate role columns — RACI needs at least one role to plot against.</div>';
      return;
    }
    var html = '<div class="matrix-note"><strong>R</strong> = the lane a task sits in (who performs it) · <strong>A</strong> = the governance owner recorded for that task, or the process owner if the task has none. This record tracks one owner per task, so Consulted/Informed aren’t derived here — that would need a schema extension for multiple roles per task.</div>';
    html += '<div class="matrix-table-wrap"><table class="matrix-table"><thead><tr><th class="matrix-row-col">Task</th>';
    data.roles.forEach(function (r) { html += "<th>" + escapeHtml(r) + "</th>"; });
    html += "</tr></thead><tbody>";
    data.rows.forEach(function (row) {
      html += '<tr><td class="matrix-row-col">' + escapeHtml(row.name) + "</td>";
      data.roles.forEach(function (r) {
        var marks = [];
        if (r && row.laneRole === r) marks.push("R");
        if (r && row.ownerRole === r) marks.push("A");
        html += '<td class="matrix-cell' + (marks.length ? " has-mark" : "") + '">' + marks.join("/") + "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    host.innerHTML = html;
  }

  function buildFlowGraph() {
    var nodes = {}, edges = [];
    if (!modeler) return { nodes: nodes, edges: edges };
    var laneIndex = buildLaneIndex();
    modeler.get("elementRegistry").getAll().forEach(function (el) {
      if (el.type === "label") return;
      var t = el.type.replace(/^bpmn:/, "");
      if (t === "SequenceFlow") {
        var bo = el.businessObject;
        if (bo && bo.sourceRef && bo.targetRef) edges.push({ source: bo.sourceRef.id, target: bo.targetRef.id });
        return;
      }
      if (/Task$|SubProcess$|CallActivity$|Event$|Gateway$/.test(t)) {
        nodes[el.id] = {
          id: el.id,
          name: (el.businessObject && el.businessObject.name) || humanizeType(el.type),
          type: t,
          laneRole: laneIndex[el.id] || ""
        };
      }
    });
    edges = edges.filter(function (e) { return nodes[e.source] && nodes[e.target]; });
    return { nodes: nodes, edges: edges };
  }

  // Longest-path leveling (Kahn's-algorithm-style topological pass): every
  // node's column is 1 + the max column of any node that flows into it, so
  // parallel branches naturally line up on the column where they rejoin.
  function levelNodes(nodes, edges) {
    var ids = Object.keys(nodes);
    var indeg = {}, adj = {};
    ids.forEach(function (id) { indeg[id] = 0; adj[id] = []; });
    edges.forEach(function (e) { adj[e.source].push(e.target); indeg[e.target] = (indeg[e.target] || 0) + 1; });
    var level = {};
    var queue = ids.filter(function (id) { return indeg[id] === 0; });
    queue.forEach(function (id) { level[id] = 0; });
    var qi = 0, guard = 0, maxGuard = ids.length * 4 + 20;
    var inQueue = {};
    queue.forEach(function (id) { inQueue[id] = true; });
    while (qi < queue.length && guard++ < maxGuard) {
      var id = queue[qi++];
      adj[id].forEach(function (n) {
        var cand = (level[id] || 0) + 1;
        if (level[n] === undefined || cand > level[n]) level[n] = cand;
        indeg[n]--;
        if (indeg[n] <= 0 && !inQueue[n]) { inQueue[n] = true; queue.push(n); }
      });
    }
    ids.forEach(function (id) { if (level[id] === undefined) level[id] = 0; }); // isolated nodes / cycle leftovers
    return level;
  }

  var METRO_COLORS = ["#0E7C6B", "#B0342B", "#9C6B0A", "#2C6FB0", "#7B4FA0", "#B0637E", "#4E8C3F", "#3F7A8C"];

  function truncateLabel(s, n) {
    s = s || "";
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }

  function renderMetroView(proc) {
    var host = $("#metro-content");
    if (!host) return;
    if (!proc) { host.innerHTML = '<div class="empty-panel">Select or create a process to see its metro map.</div>'; return; }
    var graph = buildFlowGraph();
    var ids = Object.keys(graph.nodes);
    if (!ids.length) {
      host.innerHTML = '<div class="empty-panel">Nothing to map yet — add some tasks and connect them with sequence flows, then switch back here.</div>';
      return;
    }
    var levels = levelNodes(graph.nodes, graph.edges);
    var lanesInOrder = [], laneSeen = {};
    ids.forEach(function (id) {
      var lr = graph.nodes[id].laneRole || "Unassigned";
      if (!laneSeen[lr]) { laneSeen[lr] = true; lanesInOrder.push(lr); }
    });
    var laneRow = {}, laneColor = {};
    lanesInOrder.forEach(function (l, i) { laneRow[l] = i; laneColor[l] = METRO_COLORS[i % METRO_COLORS.length]; });
    var maxLevel = 0;
    ids.forEach(function (id) { if (levels[id] > maxLevel) maxLevel = levels[id]; });

    var colW = 140, rowH = 84, marginX = 90, marginY = 46;
    var width = marginX * 2 + maxLevel * colW;
    var height = marginY * 2 + Math.max(0, lanesInOrder.length - 1) * rowH;

    function pos(id) {
      var lr = graph.nodes[id].laneRole || "Unassigned";
      return { x: marginX + levels[id] * colW, y: marginY + laneRow[lr] * rowH };
    }

    var svg = '<svg viewBox="0 0 ' + width + " " + height + '" width="' + width + '" height="' + height + '" class="metro-svg" role="img" aria-label="Metro map of ' + escapeHtml(proc.name) + '">';
    lanesInOrder.forEach(function (l) {
      var y = marginY + laneRow[l] * rowH;
      svg += '<line x1="' + marginX + '" y1="' + y + '" x2="' + (width - marginX) + '" y2="' + y + '" stroke="' + laneColor[l] + '" stroke-width="5" stroke-opacity="0.24" stroke-linecap="round"></line>';
      svg += '<text x="10" y="' + (y + 4) + '" class="metro-lane-label" fill="' + laneColor[l] + '">' + escapeHtml(l) + "</text>";
    });
    graph.edges.forEach(function (e) {
      var a = pos(e.source), b = pos(e.target);
      var color = laneColor[graph.nodes[e.source].laneRole || "Unassigned"];
      if (a.y === b.y) {
        svg += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="' + color + '" stroke-width="3"></line>';
      } else {
        var midX = (a.x + b.x) / 2;
        svg += '<path d="M' + a.x + " " + a.y + " L" + midX + " " + a.y + " L" + midX + " " + b.y + " L" + b.x + " " + b.y + '" stroke="' + color + '" stroke-width="2.5" fill="none"></path>';
      }
    });
    ids.forEach(function (id) {
      var n = graph.nodes[id];
      var p = pos(id);
      var color = laneColor[n.laneRole || "Unassigned"];
      var shape;
      if (/Gateway$/.test(n.type)) {
        shape = '<rect x="' + (p.x - 7) + '" y="' + (p.y - 7) + '" width="14" height="14" transform="rotate(45 ' + p.x + " " + p.y + ')" fill="var(--canvas-bg)" stroke="' + color + '" stroke-width="3"></rect>';
      } else if (/Event$/.test(n.type)) {
        shape = '<circle cx="' + p.x + '" cy="' + p.y + '" r="9" fill="var(--canvas-bg)" stroke="' + color + '" stroke-width="3"></circle>';
      } else {
        shape = '<circle cx="' + p.x + '" cy="' + p.y + '" r="8" fill="' + color + '" stroke="var(--canvas-bg)" stroke-width="2.5"></circle>';
      }
      svg += shape;
      svg += '<text x="' + p.x + '" y="' + (p.y + 23) + '" text-anchor="middle" class="metro-node-label">' + escapeHtml(truncateLabel(n.name, 18)) + "</text>";
    });
    svg += "</svg>";
    host.innerHTML = '<div class="matrix-note">Stations = tasks, events, and gateways from the diagram; lines = pool lanes (who performs the work); left-to-right position follows flow order from the process’s start.</div>' +
      '<div class="metro-svg-wrap">' + svg + "</div>";
  }

  /* ---------------------------------------------------------------------
     14. Toolbar wiring
     --------------------------------------------------------------------- */

  function withSelection(minCount, fn) {
    var sel = lastSelection.filter(function (e) { return e.type !== "label"; });
    if (sel.length >= minCount) fn(sel);
    else toast("Select at least " + minCount + " shapes first.");
  }

  function wireToolbar() {
    $("#btn-new").addEventListener("click", openNewProcessModal);
    $("#btn-import").addEventListener("click", openImportPicker);
    $("#btn-export").addEventListener("click", openExportModal);
    $("#btn-save").addEventListener("click", doSave);

    $("#btn-undo").addEventListener("click", function () { modeler && modeler.get("commandStack").undo(); });
    $("#btn-redo").addEventListener("click", function () { modeler && modeler.get("commandStack").redo(); });

    $("#btn-zoom-in").addEventListener("click", function () {
      var c = modeler.get("canvas");
      c.zoom(Math.min(4, Math.round((c.zoom() + 0.1) * 100) / 100));
      updateZoomLabel();
    });
    $("#btn-zoom-out").addEventListener("click", function () {
      var c = modeler.get("canvas");
      c.zoom(Math.max(0.2, Math.round((c.zoom() - 0.1) * 100) / 100));
      updateZoomLabel();
    });
    $("#btn-zoom-fit").addEventListener("click", function () {
      modeler.get("canvas").zoom("fit-viewport");
      updateZoomLabel();
    });

    var aligns = { "btn-align-left": "left", "btn-align-center": "center", "btn-align-right": "right", "btn-align-top": "top", "btn-align-middle": "middle", "btn-align-bottom": "bottom" };
    Object.keys(aligns).forEach(function (btnId) {
      $("#" + btnId).addEventListener("click", function () {
        withSelection(2, function (sel) {
          try { modeler.get("alignElements").trigger(sel, aligns[btnId]); } catch (e) { toast("Couldn’t align: " + e.message, "danger"); }
        });
      });
    });
    $("#btn-dist-h").addEventListener("click", function () {
      withSelection(3, function (sel) { try { modeler.get("distributeElements").trigger(sel, "horizontal"); } catch (e) { toast("Couldn’t distribute: " + e.message, "danger"); } });
    });
    $("#btn-dist-v").addEventListener("click", function () {
      withSelection(3, function (sel) { try { modeler.get("distributeElements").trigger(sel, "vertical"); } catch (e) { toast("Couldn’t distribute: " + e.message, "danger"); } });
    });

    $("#btn-toggle-library").addEventListener("click", function () { $("#library").classList.toggle("collapsed"); });
    $("#btn-toggle-panel").addEventListener("click", function () { $("#panel").classList.toggle("collapsed"); });

    $("#process-title").addEventListener("input", debounce(function () {
      var proc = getActive();
      if (!proc) return;
      proc.name = $("#process-title").value || "Untitled process";
      renderLibrary();
      markDirty();
    }, 200));

    $all(".panel-tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        activeTab = tab.getAttribute("data-tab");
        renderPanelTabs();
        renderPanel();
      });
    });

    $all(".view-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { switchView(btn.getAttribute("data-view")); });
    });

    document.addEventListener("keydown", function (e) {
      var mod = e.ctrlKey || e.metaKey;
      if (mod && (e.key === "s" || e.key === "S")) {
        e.preventDefault();
        doSave();
      }
    });

    // right-click a library card to delete (kept discoverable via a small hint,
    // since a full context menu is a reasonable v2 addition)
    $("#process-list").addEventListener("contextmenu", function (e) {
      var card = e.target.closest(".proc-card");
      if (!card) return;
      e.preventDefault();
      openDeleteConfirm(card.getAttribute("data-id"));
    });
  }

  /* ---------------------------------------------------------------------
     15. Boot
     --------------------------------------------------------------------- */

  function init() {
    applyIcons(document);
    initModeler();
    wireToolbar();
    renderLibrary();
    renderPanelTabs();

    initCapabilities().then(function () {
      if (!STATE.order.length) {
        renderTopbarTitle();
        renderStatusBarMeta();
        renderPanel();
        refreshActiveView();
        return;
      }
      if (!STATE.activeId || !STATE.processes[STATE.activeId]) {
        STATE.activeId = STATE.order[0];
      }
      renderLibrary();
      renderTopbarTitle();
      renderStatusBarMeta();
      loadProcessIntoModeler(getActive()).then(function () {
        renderPanel();
        refreshActiveView();
        dirty = false;
        updateSaveIndicator();
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
