name: tests

on:
  push:
    branches: [main]        # feature branches are covered by their pull_request run
  pull_request:

concurrency:                 # one run per ref; cancel a superseded in-progress run
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum
          POSTGRES_DB: continuum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U continuum" --health-interval 5s
          --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_server/requirements.txt   # mcp, tiktoken, jsonschema

      - name: Set up Node (JS/Python rules parity)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Browser test dependencies (Playwright + bpmn-js, pinned)
        run: |
          cd studio/test && npm ci
          npx playwright install --with-deps chromium

      - name: All suites — one standard run (tests/run_all.py)
        env:
          CONTINUUM_TEST_DATABASE_URL: postgresql://continuum:continuum@localhost:5432/continuum_test
          CONTINUUM_REQUIRE_ALL: "1"     # a skipped group fails CI, never passes silently
        run: python tests/run_all.py
