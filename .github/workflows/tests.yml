name: tests

on:
  push:
    branches: [main]        # feature branches are covered by their pull_request run
  pull_request:

concurrency:                 # one run per ref; cancel a superseded in-progress run
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_server/requirements.txt   # mcp, tiktoken, jsonschema

      - name: Harness — schemas, token budgets, traceability, scenario
        run: |
          python mcp_server/token_budget.py --validate
          python mcp_server/traceability.py
          python mcp_server/scenario.py

      - name: Test suites (470 assertions)
        run: |
          python governance/test_store.py
          python enforcement/test_enforce.py
          python signal/test_conformance.py
          python dashboard/test_rollup.py
          python audit/test_audit_chain.py
          python audit/test_anchor.py
          python audit/test_history.py
          python governance/test_retention.py
          python governance/test_taskedit.py
          python governance/test_authoring.py
          python governance/test_binding.py
          python governance/test_flow.py
          python governance/test_subprocess.py
          python governance/test_event.py
          python governance/test_role.py
          python governance/test_graphedit.py
          python governance/test_group.py
          python maps/test_mapdata.py
          python maps/test_layout.py
          python maps/test_landscape.py
          python maps/test_architecture.py
          python maps/test_strategy.py
          python maps/test_portal.py
          python bpmn/test_export.py
          python bpmn/test_import.py
          python bpmn/test_visio.py
          python builder/test_build.py
          python advisor/test_advisor.py
          python ask/test_agent.py
          python test_run.py

      - name: All green
        run: echo "ALL GREEN -- 470 assertions + 3 harness checks"
