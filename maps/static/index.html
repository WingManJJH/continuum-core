<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Continuum · Process Canvas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">Continuum <span>· Process Canvas</span></div>
    <div class="spacer"></div>
    <button class="toggle" id="themeBtn" type="button">theme: auto</button>
  </header>

  <div class="shell">
    <!-- LEFT: process nav -->
    <aside class="pane nav">
      <h2>Processes</h2>
      <ul id="proc-list" class="proc-list"><li class="muted">loading…</li></ul>
    </aside>

    <!-- CENTER: canvas + view switcher -->
    <section class="pane center">
      <div class="viewbar">
        <div id="proc-title" class="proc-title"></div>
        <button id="add-step" class="add-btn" type="button" title="Add a step to this process">+ Step</button>
        <nav class="views">
          <button data-view="flow" class="active">Flowchart</button>
          <button data-view="raci">RACI</button>
          <button data-view="checklist">Checklist</button>
        </nav>
      </div>
      <div id="canvas" class="canvas"></div>
    </section>

    <!-- RIGHT: contextual properties -->
    <aside class="pane props">
      <div id="props"><div class="muted center">Select a step on the canvas to see its risks, KPIs, and guardrail — and edit the guardrail here.</div></div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
